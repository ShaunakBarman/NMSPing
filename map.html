<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Floor G Map</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4">
  <div class="max-w-5xl mx-auto space-y-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <h1 class="text-lg font-bold text-white">NMSPing — Room Outliner (Floor G)</h1>
        <p class="text-xs text-slate-400">
          1. Click corners of ONE room on the picture. 2. Click "Save Room". 3. Click "Copy Code" when done.
        </p>
      </div>
      <div class="flex gap-2">
        <button id="undoPointBtn" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-semibold cursor-pointer">
          Undo Last Click
        </button>
        <button id="saveRoomBtn" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-xs font-semibold text-white cursor-pointer">
          Save Room
        </button>
        <button id="copyCodeBtn" class="px-3 py-1.5 rounded-lg bg-blue-600 hover:bg-blue-500 text-xs font-semibold text-white cursor-pointer">
          Copy Code
        </button>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
      <!-- Left: Saved Rooms List -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
        <h2 class="text-sm font-bold text-slate-300">Saved Rooms</h2>
        <div id="roomList" class="space-y-2 text-sm text-slate-400">
          No rooms outlined yet. Click corners of a room on the image!
        </div>
      </div>

      <!-- Right: Your Picture + Clickable Overlay -->
      <div class="md:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-3">
        <svg id="mapSvg" viewBox="0 0 1000 700" class="w-full h-auto rounded-xl bg-slate-950 border border-slate-800 cursor-crosshair">
          <!-- Your Floor G Picture -->
          <image href="floor-G.png" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet" />
          <!-- Saved Rooms Layer -->
          <g id="savedLayer"></g>
          <!-- Current Room Being Outlined -->
          <polygon id="draftPoly" points="" fill="rgba(59,130,246,0.35)" stroke="#60a5fa" stroke-width="3" />
          <g id="draftDots"></g>
        </svg>
      </div>
    </div>
  </div>

  <script>
    const mapSvg = document.getElementById("mapSvg");
    const savedLayer = document.getElementById("savedLayer");
    const draftPoly = document.getElementById("draftPoly");
    const draftDots = document.getElementById("draftDots");
    const roomList = document.getElementById("roomList");

    let currentPoints = [];
    let savedRooms = [];

    function getSvgCoords(evt) {
      const rect = mapSvg.getBoundingClientRect();
      const x = Math.round(((evt.clientX - rect.left) / rect.width) * 1000);
      const y = Math.round(((evt.clientY - rect.top) / rect.height) * 700);
      return { x, y };
    }

    function renderDraft() {
      draftPoly.setAttribute("points", currentPoints.map(p => `${p.x},${p.y}`).join(" "));
      draftDots.innerHTML = "";
      currentPoints.forEach(p => {
        const c = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        c.setAttribute("cx", p.x);
        c.setAttribute("cy", p.y);
        c.setAttribute("r", "5");
        c.setAttribute("fill", "#ffffff");
        draftDots.appendChild(c);
      });
    }

    function renderSaved() {
      savedLayer.innerHTML = "";
      roomList.innerHTML = savedRooms.length ? "" : "No rooms outlined yet. Click corners of a room on the image!";

      savedRooms.forEach((room, idx) => {
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", room.points);
        poly.setAttribute("fill", "rgba(16,185,129,0.28)");
        poly.setAttribute("stroke", "#34d399");
        poly.setAttribute("stroke-width", "2.5");
        poly.style.cursor = "pointer";
        poly.addEventListener("click", (e) => {
          e.stopPropagation();
          alert(`You tapped: ${room.name}`);
        });
        savedLayer.appendChild(poly);

        const btn = document.createElement("div");
        btn.className = "flex items-center justify-between bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200";
        btn.innerHTML = `<span>${room.name}</span><button class="text-xs text-red-400 hover:text-red-300 cursor-pointer">Delete</button>`;
        btn.querySelector("button").addEventListener("click", () => {
          savedRooms.splice(idx, 1);
          renderSaved();
        });
        roomList.appendChild(btn);
      });
    }

    mapSvg.addEventListener("click", (evt) => {
      const pt = getSvgCoords(evt);
      currentPoints.push(pt);
      renderDraft();
    });

    document.getElementById("undoPointBtn").addEventListener("click", () => {
      currentPoints.pop();
      renderDraft();
    });

    document.getElementById("saveRoomBtn").addEventListener("click", () => {
      if (currentPoints.length < 3) {
        alert("Click at least 3 corners of a room on the picture first!");
        return;
      }
      const name = prompt("What is this room called? (Example: Meeting Room or 9A)");
      if (!name) return;
      savedRooms.push({
        name: name.trim(),
        points: currentPoints.map(p => `${p.x},${p.y}`).join(" ")
      });
      currentPoints = [];
      renderDraft();
      renderSaved();
    });

    document.getElementById("copyCodeBtn").addEventListener("click", async () => {
      const json = JSON.stringify(savedRooms, null, 2);
      await navigator.clipboard.writeText(json);
      alert("Copied! Paste this into our chat so I can lock it into your app.");
    });
  </script>
</body>
</html>
