<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl">
    <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
      NMSPing • GEMS New Millennium School
    </span>
    <h1 class="text-2xl font-bold text-white mt-3">Sign In</h1>
    <p class="text-sm text-slate-400 mt-1 mb-5">
      Sign in with your <strong class="text-slate-200">@gemsed.com</strong> account.
    </p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="emailInput" class="block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input
          id="emailInput"
          type="email"
          required
          placeholder="name@gemsed.com"
          class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label for="passwordInput" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input
          id="passwordInput"
          type="password"
          required
          placeholder="Enter password"
          class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none"
        />
      </div>

      <button
        id="loginBtn"
        type="submit"
        class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 transition cursor-pointer"
      >
        Sign In
      </button>
    </form>

    <div id="msgBox" class="hidden mt-4 rounded-xl p-3 text-sm border"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    import { firebaseConfig, mountNmsOpeningSplash } from "./nms-data.js";

    mountNmsOpeningSplash();

    const ADMIN_EMAILS = ["admin_nms@gemsed.com"];
    const TEACHER_EMAILS = ["teach_nms@gemsed.com"];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const msgBox = document.getElementById("msgBox");

    function showMsg(text, error = false) {
      msgBox.classList.remove(
        "hidden",
        "bg-red-950/60", "border-red-800", "text-red-200",
        "bg-emerald-950/60", "border-emerald-800", "text-emerald-200"
      );
      msgBox.classList.add(
        ...(error
          ? ["bg-red-950/60", "border-red-800", "text-red-200"]
          : ["bg-emerald-950/60", "border-emerald-800", "text-emerald-200"])
      );
      msgBox.textContent = text;
    }

    async function routeUser(user) {
      const email = (user.email || "").trim().toLowerCase();
      if (!email.endsWith("@gemsed.com")) {
        await signOut(auth);
        showMsg("Only @gemsed.com accounts are allowed.", true);
        return;
      }

      if (ADMIN_EMAILS.includes(email)) {
        window.location.replace("./admin.html");
        return;
      }

      if (TEACHER_EMAILS.includes(email)) {
        window.location.replace("./teacher.html");
        return;
      }

      // Check role in Firebase if admin assigned one
      try {
        const userKey = email.replace(/[^a-z0-9]/g, "_");
        const snap = await get(ref(db, `users/${userKey}`));
        if (snap.exists()) {
          const role = snap.val()?.role;
          if (role === "admin") return window.location.replace("./admin.html");
          if (role === "teacher") return window.location.replace("./teacher.html");
        }
      } catch (_) {}

      window.location.replace("./student.html");
    }

    auth.authStateReady().then(() => {
      if (auth.currentUser) routeUser(auth.currentUser);
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      try {
        const cred = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        await routeUser(cred.user);
      } catch (err) {
        showMsg(err.message, true);
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
