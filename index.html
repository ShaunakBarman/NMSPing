<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl">
    <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
      NMSPing Test Run
    </span>
    <h1 class="text-2xl font-bold text-white mt-3">Sign In</h1>
    <p class="text-sm text-slate-400 mt-1 mb-5">
      Sign in with your <strong class="text-slate-200">@gemsed.com</strong> test account.
    </p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="emailInput" class="block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input
          id="emailInput"
          type="email"
          required
          placeholder="shaunak.b1_nms@gemsed.com"
          class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label for="passwordInput" class="block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input
          id="passwordInput"
          type="password"
          required
          placeholder="Enter password"
          class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none"
        />
      </div>

      <button
        id="loginBtn"
        type="submit"
        class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 transition cursor-pointer"
      >
        Sign In
      </button>
    </form>

    <div id="msgBox" class="hidden mt-4 rounded-xl p-3 text-sm border"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "nmsping-a2909.firebaseapp.com",
      databaseURL: "https://nmsping-a2909-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nmsping-a2909",
      storageBucket: "nmsping-a2909.firebasestorage.app",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const TEACHER_EMAILS = ["teach_nms@gemsed.com"];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const msgBox = document.getElementById("msgBox");

    function showMsg(text, error = false) {
      msgBox.classList.remove(
        "hidden",
        "bg-red-950/60", "border-red-800", "text-red-200",
        "bg-emerald-950/60", "border-emerald-800", "text-emerald-200"
      );
      msgBox.classList.add(
        ...(error
          ? ["bg-red-950/60", "border-red-800", "text-red-200"]
          : ["bg-emerald-950/60", "border-emerald-800", "text-emerald-200"])
      );
      msgBox.textContent = text;
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      try {
        const cred = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        const email = (cred.user.email || "").toLowerCase();
        if (!email.endsWith("@gemsed.com")) {
          await signOut(auth);
          showMsg("Only @gemsed.com accounts are allowed.", true);
        }
      } catch (err) {
        showMsg(err.message, true);
      } finally {
        loginBtn.disabled = false;
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (!user) return;
      const email = (user.email || "").toLowerCase();
      if (!email.endsWith("@gemsed.com")) {
        await signOut(auth);
        showMsg("Only @gemsed.com accounts are allowed.", true);
        return;
      }
      if (TEACHER_EMAILS.includes(email)) {
        window.location.href = "./teacher.html";
      } else {
        window.location.href = "./student.html";
      }
    });
  </script>
</body>
</html>
