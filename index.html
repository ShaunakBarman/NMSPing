<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-4">
  <main class="nms-card w-full max-w-md rounded-2xl bg-slate-900 border border-slate-800 p-6 shadow-xl">
    <span class="inline-block text-xs font-semibold px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 border border-emerald-500/30">
      NMSPing • GEMS New Millennium School
    </span>
    <h1 class="nms-heading text-2xl font-bold text-white mt-3">Sign In</h1>
    <p class="nms-muted text-sm text-slate-400 mt-1 mb-5">
      Sign in with your <strong class="text-slate-200">@gemsed.com</strong> account.
    </p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label for="emailInput" class="nms-muted block text-sm font-medium text-slate-300 mb-1">Email</label>
        <input
          id="emailInput"
          type="email"
          required
          placeholder="name@gemsed.com"
          class="nms-input w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none"
        />
      </div>

      <div>
        <label for="passwordInput" class="nms-muted block text-sm font-medium text-slate-300 mb-1">Password</label>
        <input
          id="passwordInput"
          type="password"
          required
          placeholder="Enter password"
          class="nms-input w-full rounded-xl bg-slate-950 border border-slate-700 px-3.5 py-2.5 text-sm text-white focus:border-blue-500 focus:outline-none"
        />
      </div>

      <button
        id="loginBtn"
        type="submit"
        class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 transition cursor-pointer"
      >
        Sign In
      </button>
    </form>

    <div id="msgBox" class="hidden mt-4 rounded-xl p-3 text-sm border"></div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    import { firebaseConfig, getUserRole, mountNmsOpeningSplash } from "./nms-data.js";

    mountNmsOpeningSplash();

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const loginForm = document.getElementById("loginForm");
    const emailInput = document.getElementById("emailInput");
    const passwordInput = document.getElementById("passwordInput");
    const loginBtn = document.getElementById("loginBtn");
    const msgBox = document.getElementById("msgBox");

    function showMsg(text, error = false) {
      msgBox.classList.remove(
        "hidden",
        "bg-red-950/60", "border-red-800", "text-red-200",
        "bg-amber-950/60", "border-amber-800", "text-amber-200",
        "bg-emerald-950/60", "border-emerald-800", "text-emerald-200"
      );
      msgBox.classList.add(
        ...(error
          ? ["bg-red-950/60", "border-red-800", "text-red-200"]
          : ["bg-emerald-950/60", "border-emerald-800", "text-emerald-200"])
      );
      msgBox.textContent = text;
    }

    async function routeUser(user) {
      const { role, reason, dbError } = await getUserRole(db, user.email);
      if (role === "blocked") {
        await signOut(auth);
        showMsg(reason || "Only @gemsed.com accounts are allowed.", true);
        return;
      }

      if (dbError) {
        showMsg(`Note: Could not read /users role (${dbError}). Routing as ${role}...`, true);
      }

      if (role === "admin") {
        window.location.replace("./admin.html");
        return;
      }
      if (role === "teacher") {
        window.location.replace("./teacher.html");
        return;
      }
      window.location.replace("./student.html");
    }

    auth.authStateReady().then(() => {
      if (auth.currentUser) routeUser(auth.currentUser);
    });

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginBtn.disabled = true;
      try {
        const cred = await signInWithEmailAndPassword(auth, emailInput.value.trim(), passwordInput.value);
        await routeUser(cred.user);
      } catch (err) {
        showMsg(err.message, true);
      } finally {
        loginBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
