<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Teacher Console</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    .room-poly {
      fill: rgba(59, 130, 246, 0.22);
      stroke: #93c5fd;
      stroke-width: 2;
      cursor: pointer;
    }
    .room-poly:hover { fill: rgba(59, 130, 246, 0.4); }
    .room-poly.active { fill: rgba(16, 185, 129, 0.36); stroke: #34d399; stroke-width: 3; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-3 sm:p-5">
  <div class="max-w-6xl mx-auto space-y-4">
    <div id="campusBanner" class="hidden rounded-2xl bg-amber-500/20 border border-amber-400/50 px-4 py-2.5 text-xs font-semibold text-amber-200"></div>

    <header class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="text-xs font-semibold text-emerald-400 uppercase">Teacher Console</div>
        <h1 id="teacherTitle" class="nms-heading text-xl font-bold text-white">teach_nms</h1>
        <p id="clockText" class="nms-muted text-xs text-slate-400 mt-0.5"></p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="themeToggleBtn" type="button" class="nms-subcard px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 cursor-pointer">
          🌙 Night Mode
        </button>
        <button id="enableNotifBtn" type="button" class="px-3 py-2 rounded-xl text-xs font-semibold bg-amber-500/20 border border-amber-400/50 text-amber-200 cursor-pointer">
          Enable Ping Alerts
        </button>
        <button type="button" data-floor="g" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer">Floor G</button>
        <button type="button" data-floor="1" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 1</button>
        <button type="button" data-floor="2" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 2</button>
        <button type="button" data-floor="3" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 3</button>
        <button id="logoutBtn" type="button" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer">Log Out</button>
      </div>
    </header>

    <section class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
      <div class="flex items-center justify-between">
        <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">
          Incoming Student Pings (<span id="pingCount">0</span>)
        </h2>
        <button id="clearAllPingsBtn" type="button" class="nms-muted text-xs text-slate-400 hover:text-white cursor-pointer">Clear All</button>
      </div>
      <div id="pingsList" class="nms-muted space-y-2 text-xs text-slate-400">No student pings yet.</div>
    </section>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <aside class="space-y-4">
        <div class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
          <div class="nms-muted text-xs text-slate-400">
            Selected Room: <strong id="selectedRoomLabel" class="text-emerald-400">None</strong>
          </div>

          <button id="confirmRoomBtn" type="button" class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 text-sm cursor-pointer">
            Confirm Selected Room
          </button>

          <button id="byTimetableBtn" type="button" class="w-full rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 px-4 text-sm cursor-pointer">
            According to Timetable (Confirm)
          </button>

          <button id="autoModeBtn" type="button" class="nms-subcard w-full rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-semibold py-2 px-4 text-xs cursor-pointer">
            Resume Auto-Timetable Mode
          </button>

          <button id="dndBtn" type="button" class="w-full rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-semibold py-2.5 px-4 text-sm cursor-pointer">
            Do Not Disturb (Remove from Map)
          </button>

          <div id="statusBanner" class="nms-subcard text-xs rounded-xl bg-slate-950 border border-slate-800 p-3">
            Status: Auto-timetable checking every 10s...
          </div>
        </div>

        <div class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
          <h2 class="nms-heading text-sm font-bold text-white">Timetable Photo & Auto Slots</h2>

          <input id="timetablePhoto" type="file" accept="image/*" class="block w-full text-xs text-slate-400 cursor-pointer" />
          <p id="ocrNote" class="nms-muted text-[11px] text-slate-400 hidden"></p>
          <textarea id="ocrRaw" rows="2" class="nms-input hidden w-full rounded-lg bg-slate-950 border border-slate-800 p-2 text-[11px]"></textarea>

          <div class="grid grid-cols-2 gap-2">
            <select id="slotDay" class="nms-input rounded-lg bg-slate-950 border border-slate-700 px-2 py-1.5 text-xs">
              <option value="0">Sunday</option>
              <option value="1">Monday</option>
              <option value="2">Tuesday</option>
              <option value="3">Wednesday</option>
              <option value="4">Thursday</option>
              <option value="5">Friday</option>
              <option value="6">Saturday</option>
            </select>
            <select id="slotFloor" class="nms-input rounded-lg bg-slate-950 border border-slate-700 px-2 py-1.5 text-xs">
              <option value="g">Floor G</option>
              <option value="1">Floor 1</option>
              <option value="2">Floor 2</option>
              <option value="3">Floor 3</option>
            </select>
            <input id="slotStart" type="time" value="14:00" class="nms-input rounded-lg bg-slate-950 border border-slate-700 px-2 py-1.5 text-xs" />
            <input id="slotEnd" type="time" value="15:00" class="nms-input rounded-lg bg-slate-950 border border-slate-700 px-2 py-1.5 text-xs" />
          </div>

          <input id="slotRoom" type="text" placeholder="Room name (e.g. Canteen or 280)" class="nms-input w-full rounded-lg bg-slate-950 border border-slate-700 px-2.5 py-1.5 text-xs" />

          <button id="addSlotBtn" type="button" class="w-full rounded-xl bg-amber-500/20 hover:bg-amber-500/30 border border-amber-400/50 text-amber-300 font-semibold py-2 px-3 text-xs cursor-pointer">
            Save Timetable Slot
          </button>

          <div id="slotList" class="nms-muted space-y-1.5 text-xs text-slate-400"></div>
        </div>
      </aside>

      <section class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-3 sm:p-4 lg:col-span-2 space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span id="activeFloorLabel" class="text-xs font-bold uppercase tracking-wider text-emerald-400">Floor G</span>
          <div class="flex items-center gap-2">
            <button id="rotateMapBtn" type="button" class="nms-subcard px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-700 cursor-pointer">
              🔄 Rotate 90°
            </button>
          </div>
        </div>

        <div class="overflow-x-auto">
          <div id="mapFrame" class="nms-map-sheet min-w-[320px]">
            <svg id="mapSvg" viewBox="0 0 1000 700" class="w-full h-auto rounded-xl bg-slate-950 border border-slate-800 touch-manipulation">
              <image id="floorImg" href="./floor-g.jpg" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet" />
              <g id="polyLayer"></g>
              <g id="labelLayer"></g>
            </svg>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, set, remove, onValue } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    import { firebaseConfig, DEFAULT_FLOORS, mergeFloorRooms, mountNmsOpeningSplash, initDayNightToggle } from "./nms-data.js";

    mountNmsOpeningSplash();
    initDayNightToggle("themeToggleBtn");

    const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let teacherKey = "teach_nms_gemsed_com";
    let displayName = "teach_nms";
    let currentFloor = "g";
    let selectedRoom = null;
    let rotationDeg = 0;
    let slots = [];
    let currentState = {};
    let overridesByFloor = { g: {}, "1": {}, "2": {}, "3": {} };
    let isLoggingOut = false;
    let knownPingIds = new Set();
    let initialPingsLoaded = false;

    const teacherTitle = document.getElementById("teacherTitle");
    const clockText = document.getElementById("clockText");
    const selectedRoomLabel = document.getElementById("selectedRoomLabel");
    const statusBanner = document.getElementById("statusBanner");
    const floorImg = document.getElementById("floorImg");
    const polyLayer = document.getElementById("polyLayer");
    const labelLayer = document.getElementById("labelLayer");
    const slotList = document.getElementById("slotList");
    const pingsList = document.getElementById("pingsList");
    const pingCount = document.getElementById("pingCount");
    const mapFrame = document.getElementById("mapFrame");
    const activeFloorLabel = document.getElementById("activeFloorLabel");

    document.getElementById("slotDay").value = String(new Date().getDay());

    function playChime() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1174, ctx.currentTime + 0.18);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.36);
      } catch (_) {}
    }

    function notifyTeacher(ping) {
      playChime();
      if ("Notification" in window && Notification.permission === "granted") {
        new Notification(`NMSPing from ${ping.from}`, { body: `${ping.reason}` });
      }
    }

    function centerOf(pointsStr) {
      const pts = pointsStr.trim().split(/\s+/).map(p => {
        const [x, y] = p.split(",").map(Number);
        return { x, y };
      });
      const sum = pts.reduce((a, b) => ({ x: a.x + b.x, y: a.y + b.y }), { x: 0, y: 0 });
      return { x: Math.round(sum.x / pts.length), y: Math.round(sum.y / pts.length) };
    }

    function timeToMinutes(hhmm) {
      const [h, m] = (hhmm || "00:00").split(":").map(Number);
      return h * 60 + m;
    }

    function findMatchingSlot() {
      const now = new Date();
      const day = String(now.getDay());
      const mins = now.getHours() * 60 + now.getMinutes();
      return slots.find(s => s.day === day && mins >= timeToMinutes(s.start) && mins <= timeToMinutes(s.end)) || null;
    }

    function updateClock() {
      const now = new Date();
      clockText.textContent = `Current Time: ${DAYS[now.getDay()]} ${now.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" })}`;
    }

    function applyRotation() {
      const scale = rotationDeg % 180 !== 0 ? " scale(0.76)" : "";
      mapFrame.style.transformOrigin = "center center";
      mapFrame.style.transform = `rotate(${rotationDeg}deg)${scale}`;
    }

    function renderMap() {
      const floorMeta = DEFAULT_FLOORS[currentFloor];
      const rooms = mergeFloorRooms(currentFloor, overridesByFloor[currentFloor] || {});
      activeFloorLabel.textContent = `${floorMeta.label} (${rooms.length} zones)`;
      floorImg.setAttribute("href", floorMeta.img);

      document.querySelectorAll(".floor-btn").forEach(btn => {
        btn.className = btn.dataset.floor === currentFloor
          ? "floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer"
          : "floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer";
      });

      polyLayer.innerHTML = "";
      labelLayer.innerHTML = "";

      rooms.forEach(room => {
        const c = centerOf(room.points);
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", room.points);
        poly.setAttribute("class", selectedRoom === room.name ? "room-poly active" : "room-poly");
        poly.addEventListener("click", () => {
          selectedRoom = room.name;
          selectedRoomLabel.textContent = `${floorMeta.label} • ${room.name}`;
          renderMap();
        });
        polyLayer.appendChild(poly);

        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", c.x);
        txt.setAttribute("y", c.y + 3);
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("fill", "#ffffff");
        txt.setAttribute("font-size", "9");
        txt.setAttribute("font-weight", "700");
        txt.setAttribute("pointer-events", "none");
        txt.textContent = room.name;
        labelLayer.appendChild(txt);
      });
    }

    function renderSlots() {
      slotList.innerHTML = slots.length ? "" : "<p>No timetable slots saved yet.</p>";
      slots.forEach((s, i) => {
        const div = document.createElement("div");
        div.className = "nms-subcard flex items-center justify-between bg-slate-950 border border-slate-800 rounded-lg px-2.5 py-1.5";
        div.innerHTML = `<span>${DAYS[Number(s.day)]} ${s.start}-${s.end} • Floor ${s.floor.toUpperCase()} ${s.room}</span><button type="button" class="text-red-400 cursor-pointer">✕</button>`;
        div.querySelector("button").addEventListener("click", async () => {
          slots.splice(i, 1);
          await set(ref(db, `timetables/${teacherKey}`), slots);
        });
        slotList.appendChild(div);
      });
    }

    async function checkAutoTimetable() {
      if (!auth.currentUser || !teacherKey) return;
      if (currentState.dnd || currentState.confirmed) return;

      const match = findMatchingSlot();
      if (match) {
        if (currentState.mode !== "possible" || currentState.floor !== match.floor || currentState.room !== match.room) {
          await set(ref(db, `presence/${teacherKey}`), {
            name: displayName,
            floor: match.floor,
            room: match.room,
            mode: "possible",
            confirmed: false,
            dnd: false,
            updatedAt: Date.now()
          });
        }
      } else if (currentState.mode && currentState.mode !== "off") {
        await set(ref(db, `presence/${teacherKey}`), {
          name: displayName,
          floor: currentState.floor || "g",
          room: "",
          mode: "off",
          confirmed: false,
          dnd: false,
          updatedAt: Date.now()
        });
      }
    }

    document.getElementById("rotateMapBtn").addEventListener("click", () => {
      rotationDeg = (rotationDeg + 90) % 360;
      applyRotation();
    });

    document.getElementById("enableNotifBtn").addEventListener("click", async () => {
      if (!("Notification" in window)) return alert("In-page chime and alerts are active.");
      const perm = await Notification.requestPermission();
      if (perm === "granted") { playChime(); alert("Ping alerts enabled!"); }
    });

    document.querySelectorAll(".floor-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentFloor = btn.dataset.floor;
        selectedRoom = null;
        selectedRoomLabel.textContent = "None";
        renderMap();
      });
    });

    document.getElementById("confirmRoomBtn").addEventListener("click", async () => {
      if (!selectedRoom) return alert("Tap a room on the map first!");
      await set(ref(db, `presence/${teacherKey}`), {
        name: displayName, floor: currentFloor, room: selectedRoom, mode: "confirmed", confirmed: true, dnd: false, updatedAt: Date.now()
      });
    });

    document.getElementById("byTimetableBtn").addEventListener("click", async () => {
      const match = findMatchingSlot();
      if (!match) return alert("No timetable slot matches the current day and time.");
      currentFloor = match.floor;
      selectedRoom = match.room;
      selectedRoomLabel.textContent = `Floor ${match.floor.toUpperCase()} • ${match.room}`;
      await set(ref(db, `presence/${teacherKey}`), {
        name: displayName, floor: match.floor, room: match.room, mode: "confirmed", confirmed: true, dnd: false, updatedAt: Date.now()
      });
      renderMap();
    });

    document.getElementById("autoModeBtn").addEventListener("click", async () => {
      await set(ref(db, `presence/${teacherKey}`), {
        name: displayName, floor: currentFloor, room: "", mode: "off", confirmed: false, dnd: false, updatedAt: Date.now()
      });
      await checkAutoTimetable();
    });

    document.getElementById("dndBtn").addEventListener("click", async () => {
      await set(ref(db, `presence/${teacherKey}`), {
        name: displayName, floor: currentFloor, room: "", mode: "dnd", confirmed: false, dnd: true, updatedAt: Date.now()
      });
    });

    document.getElementById("clearAllPingsBtn").addEventListener("click", () => remove(ref(db, `pings/${teacherKey}`)));

    document.getElementById("addSlotBtn").addEventListener("click", async () => {
      const room = document.getElementById("slotRoom").value.trim();
      if (!room) return alert("Enter a room name.");
      slots.push({
        day: document.getElementById("slotDay").value,
        floor: document.getElementById("slotFloor").value,
        start: document.getElementById("slotStart").value,
        end: document.getElementById("slotEnd").value,
        room
      });
      await set(ref(db, `timetables/${teacherKey}`), slots);
      document.getElementById("slotRoom").value = "";
    });

    document.getElementById("timetablePhoto").addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      const ocrNote = document.getElementById("ocrNote");
      const ocrRaw = document.getElementById("ocrRaw");
      ocrNote.classList.remove("hidden");
      ocrRaw.classList.remove("hidden");
      ocrNote.textContent = "Reading timetable image...";
      const { data } = await Tesseract.recognize(file, "eng");
      ocrRaw.value = (data.text || "").trim();
      ocrNote.textContent = "Text extracted—add your matching day/time/room slot.";
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      isLoggingOut = true;
      await signOut(auth);
      window.location.replace("./index.html");
    });

    renderMap();
    updateClock();

    auth.authStateReady().then(() => {
      if (!auth.currentUser) return window.location.replace("./index.html");
      const email = (auth.currentUser.email || "").toLowerCase();
      displayName = email.split("@")[0];
      teacherKey = email.replace(/[^a-z0-9]/g, "_");
      teacherTitle.textContent = displayName;

      onValue(ref(db, "mapOverrides"), (snap) => {
        const val = snap.val() || {};
        overridesByFloor = { g: val.g || {}, "1": val["1"] || {}, "2": val["2"] || {} };
        renderMap();
      });

      onValue(ref(db, "announcement"), (snap) => {
        const banner = document.getElementById("campusBanner");
        const txt = snap.val()?.text || "";
        banner.textContent = txt;
        banner.classList.toggle("hidden", !txt);
      });

      onValue(ref(db, `pings/${teacherKey}`), (snap) => {
        const val = snap.val() || {};
        const entries = Object.entries(val).sort((a, b) => (b[1].createdAt || 0) - (a[1].createdAt || 0));
        pingCount.textContent = String(entries.length);
        pingsList.innerHTML = entries.length ? "" : "No student pings yet.";
        entries.forEach(([id, p]) => {
          const isSilentComing = p.type === "coming";
          if (initialPingsLoaded && !knownPingIds.has(id) && !isSilentComing) notifyTeacher(p);
          knownPingIds.add(id);
          const timeStr = p.createdAt ? new Date(p.createdAt).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "";
          const row = document.createElement("div");
          row.className = isSilentComing
            ? "flex flex-wrap items-center justify-between gap-2 bg-sky-950/50 border border-sky-500/40 rounded-xl px-3 py-2 text-slate-200"
            : "flex flex-wrap items-center justify-between gap-2 bg-amber-950/50 border border-amber-500/40 rounded-xl px-3 py-2 text-slate-200";
          row.innerHTML = `
            <div>
              <span class="font-bold text-white">${p.from}${isSilentComing ? " is coming" : ""}</span>
              <span class="ml-2">• ${p.reason}</span>
              <span class="text-slate-400 ml-2">${timeStr}</span>
            </div>
            <button type="button" class="text-xs px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer">Dismiss</button>
          `;
          row.querySelector("button").addEventListener("click", () => remove(ref(db, `pings/${teacherKey}/${id}`)));
          pingsList.appendChild(row);
        });
        initialPingsLoaded = true;
      });

      onValue(ref(db, `timetables/${teacherKey}`), (snap) => {
        slots = snap.val() || [];
        renderSlots();
        checkAutoTimetable();
      });

      onValue(ref(db, `presence/${teacherKey}`), (snap) => {
        currentState = snap.val() || {};
        if (currentState.dnd) {
          statusBanner.textContent = "Do Not Disturb ON — hidden from student map.";
        } else if (currentState.mode === "confirmed") {
          statusBanner.textContent = `Confirmed on map: Floor ${(currentState.floor || "g").toUpperCase()} • ${currentState.room}`;
        } else if (currentState.mode === "possible") {
          statusBanner.textContent = `Auto-timetable active: showing "Possible: ${displayName}" in ${currentState.room}`;
        } else {
          statusBanner.textContent = "Auto-timetable active: no scheduled class right now.";
        }
      });

      onAuthStateChanged(auth, (user) => {
        if (!user && !isLoggingOut) window.location.replace("./index.html");
      });
    });

    setInterval(() => { updateClock(); checkAutoTimetable(); }, 10000);
  </script>
</body>
</html>
