<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Select Room & Beacon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .room-poly {
      fill: rgba(59, 130, 246, 0.22);
      stroke: #93c5fd;
      stroke-width: 2;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .room-poly:hover {
      fill: rgba(59, 130, 246, 0.42);
    }
    .room-poly.active {
      fill: rgba(16, 185, 129, 0.36);
      stroke: #34d399;
      stroke-width: 3;
    }
    @keyframes pulseBeacon {
      0% { r: 7; opacity: 0.95; }
      100% { r: 24; opacity: 0; }
    }
    .beacon-ring {
      animation: pulseBeacon 1.35s infinite ease-out;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6">
  <div class="max-w-6xl mx-auto space-y-4">
    <!-- Top Bar + Floor Buttons -->
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-4">
      <div>
        <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400">NMSPing • Teacher Location</span>
        <h1 class="text-xl font-bold text-white">Where Are You Right Now?</h1>
      </div>

      <div class="flex items-center gap-2">
        <button data-floor="g" class="floor-tab px-4 py-2 rounded-xl text-sm font-bold bg-blue-600 text-white cursor-pointer">Floor G</button>
        <button data-floor="1" class="floor-tab px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">Floor 1</button>
        <button data-floor="2" class="floor-tab px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer">Floor 2</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <!-- Left Side Room Labels -->
      <aside class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-col justify-between space-y-4">
        <div>
          <h2 id="sideTitle" class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">
            Floor G Rooms
          </h2>
          <div id="sideRoomList" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-2 gap-2"></div>
        </div>

        <div class="pt-4 border-t border-slate-800 space-y-3">
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3">
            <div class="text-xs text-slate-400">Selected Room</div>
            <div id="chosenLabel" class="text-base font-bold text-emerald-400 mt-0.5">None selected</div>
          </div>

          <button
            id="setBeaconBtn"
            disabled
            class="w-full rounded-xl bg-emerald-600 disabled:bg-slate-800 disabled:text-slate-500 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 text-sm transition cursor-pointer"
          >
            Activate 10-Min Room Beacon
          </button>

          <a
            id="matterportLink"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="hidden block text-center w-full rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-300 text-xs font-semibold py-2 px-3 transition"
          >
            View Door in 3D (Matterport)
          </a>

          <div id="statusMsg" class="hidden text-xs rounded-xl p-2.5 bg-emerald-950/60 border border-emerald-800 text-emerald-200"></div>
        </div>
      </aside>

      <!-- Right Top-View Floorplan -->
      <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs text-slate-400">Click a room on the map or on the left list</span>
          <span id="floorTag" class="text-xs font-mono px-2.5 py-1 rounded-lg bg-slate-800 text-slate-300">FLOOR G</span>
        </div>

        <svg id="floorSvg" viewBox="0 0 1000 700" class="w-full h-auto rounded-xl bg-slate-950 border border-slate-800">
          <image id="bgImage" href="floor-g.jpeg" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet" />
          <g id="roomsGroup"></g>
          <g id="labelsGroup"></g>
          <g id="beaconGroup" class="hidden">
            <circle id="beaconPulse" cx="0" cy="0" r="8" fill="none" stroke="#10b981" stroke-width="3" class="beacon-ring" />
            <circle id="beaconCore" cx="0" cy="0" r="7" fill="#10b981" stroke="#ffffff" stroke-width="2" />
          </g>
        </svg>
      </section>
    </div>
  </div>

  <script>
    // Your exact Floor G rooms pasted in, plus slots ready for Floor 1 and Floor 2
    const SCHOOL_FLOORS = {
      g: {
        label: "Floor G",
        img: "floor-g.jpeg",
        rooms: [
          { name: "132", points: "161,414 165,507 210,505 212,412", matterportUrl: "" },
          { name: "131", points: "161,388 161,303 208,301 208,388", matterportUrl: "" },
          { name: "134", points: "245,338 247,371 378,371 380,338", matterportUrl: "" },
          { name: "meet", points: "221,409 223,454 247,463 272,463 313,465 355,462 378,449 377,407", matterportUrl: "" },
          { name: "154", points: "382,344 380,371 380,393 433,391 453,371 556,370 559,390 561,337", matterportUrl: "" },
          { name: "524", points: "592,300 592,384 638,382 651,366 649,322 643,297", matterportUrl: "" },
          { name: "156", points: "596,407 596,497 645,495 654,425 642,405", matterportUrl: "" },
          { name: "608", points: "380,432 382,478 430,476 426,452 451,448 581,454 583,401 413,405", matterportUrl: "" }
        ]
      },
      "1": {
        label: "Floor 1",
        img: "floor-1.jpeg",
        rooms: []
      },
      "2": {
        label: "Floor 2",
        img: "floor-2.jpeg",
        rooms: []
      }
    };

    let activeFloor = "g";
    let selectedRoom = null;

    const sideTitle = document.getElementById("sideTitle");
    const sideRoomList = document.getElementById("sideRoomList");
    const floorTag = document.getElementById("floorTag");
    const bgImage = document.getElementById("bgImage");
    const roomsGroup = document.getElementById("roomsGroup");
    const labelsGroup = document.getElementById("labelsGroup");
    const beaconGroup = document.getElementById("beaconGroup");
    const beaconPulse = document.getElementById("beaconPulse");
    const beaconCore = document.getElementById("beaconCore");
    const chosenLabel = document.getElementById("chosenLabel");
    const setBeaconBtn = document.getElementById("setBeaconBtn");
    const matterportLink = document.getElementById("matterportLink");
    const statusMsg = document.getElementById("statusMsg");

    function getPolygonCenter(pointsStr) {
      const coords = pointsStr.trim().split(/\s+/).map(pair => {
        const [x, y] = pair.split(",").map(Number);
        return { x, y };
      });
      const sum = coords.reduce((acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }), { x: 0, y: 0 });
      return {
        x: Math.round(sum.x / coords.length),
        y: Math.round(sum.y / coords.length)
      };
    }

    function renderFloor(floorKey) {
      activeFloor = floorKey;
      const floor = SCHOOL_FLOORS[floorKey];
      sideTitle.textContent = `${floor.label} Rooms`;
      floorTag.textContent = floor.label.toUpperCase();
      bgImage.setAttribute("href", floor.img);

      document.querySelectorAll(".floor-tab").forEach(btn => {
        const isCurrent = btn.dataset.floor === floorKey;
        btn.className = isCurrent
          ? "floor-tab px-4 py-2 rounded-xl text-sm font-bold bg-blue-600 text-white cursor-pointer"
          : "floor-tab px-4 py-2 rounded-xl text-sm font-bold bg-slate-800 text-slate-300 hover:bg-slate-700 cursor-pointer";
      });

      sideRoomList.innerHTML = "";
      roomsGroup.innerHTML = "";
      labelsGroup.innerHTML = "";
      beaconGroup.classList.add("hidden");

      if (!floor.rooms.length) {
        sideRoomList.innerHTML = `<p class="col-span-2 text-xs text-slate-500">No rooms added for ${floor.label} yet.</p>`;
        return;
      }

      floor.rooms.forEach(room => {
        const isSelected = selectedRoom?.floor === floorKey && selectedRoom?.name === room.name;
        const center = getPolygonCenter(room.points);

        // Side button
        const sideBtn = document.createElement("button");
        sideBtn.type = "button";
        sideBtn.textContent = room.name;
        sideBtn.className = isSelected
          ? "px-3 py-2 rounded-xl text-xs font-bold text-left bg-emerald-500/20 border border-emerald-400 text-emerald-300 cursor-pointer"
          : "px-3 py-2 rounded-xl text-xs font-semibold text-left bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-200 cursor-pointer";
        sideBtn.addEventListener("click", () => chooseRoom(floorKey, room));
        sideRoomList.appendChild(sideBtn);

        // Clickable SVG polygon
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", room.points);
        poly.setAttribute("class", isSelected ? "room-poly active" : "room-poly");
        poly.addEventListener("click", () => chooseRoom(floorKey, room));
        roomsGroup.appendChild(poly);

        // Room text label on map
        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", center.x);
        txt.setAttribute("y", center.y + 4);
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("fill", "#ffffff");
        txt.setAttribute("font-size", "13");
        txt.setAttribute("font-weight", "bold");
        txt.setAttribute("pointer-events", "none");
        txt.textContent = room.name;
        labelsGroup.appendChild(txt);

        if (isSelected) {
          beaconPulse.setAttribute("cx", center.x);
          beaconPulse.setAttribute("cy", center.y - 12);
          beaconCore.setAttribute("cx", center.x);
          beaconCore.setAttribute("cy", center.y - 12);
          beaconGroup.classList.remove("hidden");
        }
      });
    }

    function chooseRoom(floorKey, room) {
      selectedRoom = { ...room, floor: floorKey };
      chosenLabel.textContent = `${SCHOOL_FLOORS[floorKey].label} • ${room.name}`;
      setBeaconBtn.disabled = false;
      statusMsg.classList.add("hidden");

      if (room.matterportUrl) {
        matterportLink.href = room.matterportUrl;
        matterportLink.classList.remove("hidden");
      } else {
        matterportLink.classList.add("hidden");
      }

      renderFloor(floorKey);
    }

    setBeaconBtn.addEventListener("click", () => {
      if (!selectedRoom) return;
      const expiresAt = new Date(Date.now() + 10 * 60 * 1000).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      statusMsg.textContent = `Live beacon set on ${SCHOOL_FLOORS[selectedRoom.floor].label} — ${selectedRoom.name} (expires at ${expiresAt}).`;
      statusMsg.classList.remove("hidden");
    });

    renderFloor("g");
  </script>
</body>
</html>
