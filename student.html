<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Student Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .room-poly {
      fill: rgba(59, 130, 246, 0.14);
      stroke: #60a5fa;
      stroke-width: 1.5;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-4 md:p-6">
  <div class="max-w-6xl mx-auto space-y-4">
    <header class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="text-xs font-semibold text-emerald-400 uppercase">Student Home</div>
        <h1 id="studentGreeting" class="text-xl font-bold text-white">NMSPing Map</h1>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button data-floor="g" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer">Floor G</button>
        <button data-floor="1" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 1</button>
        <button data-floor="2" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 2</button>
        <button id="logoutBtn" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer">Log Out</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <aside class="space-y-4">
        <!-- Ping Teacher Dropdown -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
          <h2 class="text-sm font-bold text-white">Ping a Teacher</h2>

          <div>
            <label for="teacherDropdown" class="block text-xs text-slate-400 mb-1">Select Teacher</label>
            <select id="teacherDropdown" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white">
              <option value="teach_nms_gemsed_com">teach_nms</option>
            </select>
          </div>

          <div>
            <label for="pingReason" class="block text-xs text-slate-400 mb-1">Quick Tag</label>
            <select id="pingReason" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm text-white">
              <option value="2-Min Question">2-Min Question</option>
              <option value="IA / Coursework Check">IA / Coursework Check</option>
              <option value="Form Signature">Form Signature</option>
            </select>
          </div>

          <button
            id="sendPingBtn"
            class="w-full rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 text-sm transition cursor-pointer"
          >
            Send Ping
          </button>

          <div id="pingStatus" class="hidden text-xs rounded-xl bg-emerald-950/60 border border-emerald-800 p-2.5 text-emerald-200"></div>
        </div>

        <!-- Visible Teachers List -->
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">On This Floor</h2>
          <div id="visibleList" class="space-y-2 text-xs text-slate-400">No teachers shown on this floor.</div>
        </div>
      </aside>

      <section class="lg:col-span-2 bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <svg id="mapSvg" viewBox="0 0 1000 700" class="w-full h-auto rounded-xl bg-slate-950 border border-slate-800">
          <image id="floorImg" href="floor-g.jpeg" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet" />
          <g id="polyLayer"></g>
          <g id="beaconLayer"></g>
        </svg>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBh4pTetUQYmIYoUKxjUA2hvvbCHwXfdgQ",
      authDomain: "nmsping-a2909.firebaseapp.com",
      projectId: "nmsping-a2909",
      storageBucket: "nmsping-a2909.firebasestorage.app",
      messagingSenderId: "321227369348",
      appId: "1:321227369348:web:86e1a1b09b8333ced48bd1",
      databaseURL: "https://nmsping-a2909-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const FLOORS = {
      g: {
        img: "floor-g.jpeg",
        rooms: [
          { name: "132", points: "161,414 165,507 210,505 212,412" },
          { name: "131", points: "161,388 161,303 208,301 208,388" },
          { name: "134", points: "245,338 247,371 378,371 380,338" },
          { name: "meet", points: "221,409 223,454 247,463 272,463 313,465 355,462 378,449 377,407" },
          { name: "154", points: "382,344 380,371 380,393 433,391 453,371 556,370 559,390 561,337" },
          { name: "524", points: "592,300 592,384 638,382 651,366 649,322 643,297" },
          { name: "156", points: "596,407 596,497 645,495 654,425 642,405" },
          { name: "608", points: "380,432 382,478 430,476 426,452 451,448 581,454 583,401 413,405" }
        ]
      },
      "1": { img: "floor-1.jpeg", rooms: [] },
      "2": { img: "floor-2.jpeg", rooms: [] }
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let currentFloor = "g";
    let allPresence = {};
    let allTimetables = {};
    let currentStudentEmail = "";
    let isLoggingOut = false;

    const floorImg = document.getElementById("floorImg");
    const polyLayer = document.getElementById("polyLayer");
    const beaconLayer = document.getElementById("beaconLayer");
    const visibleList = document.getElementById("visibleList");
    const teacherDropdown = document.getElementById("teacherDropdown");

    function centerOf(pointsStr) {
      const pts = pointsStr.trim().split(/\s+/).map(p => {
        const [x, y] = p.split(",").map(Number);
        return { x, y };
      });
      const sum = pts.reduce((a, b) => ({ x: a.x + b.x, y: a.y + b.y }), { x: 0, y: 0 });
      return { x: Math.round(sum.x / pts.length), y: Math.round(sum.y / pts.length) };
    }

    function timeToMinutes(hhmm) {
      const [h, m] = (hhmm || "00:00").split(":").map(Number);
      return h * 60 + m;
    }

    function getActiveSlot(slots) {
      const now = new Date();
      const day = String(now.getDay());
      const mins = now.getHours() * 60 + now.getMinutes();
      return (slots || []).find(s =>
        s.day === day &&
        mins >= timeToMinutes(s.start) &&
        mins <= timeToMinutes(s.end)
      ) || null;
    }

    // Combines live presence + continuous timetable check
    function getResolvedTeachers() {
      const keys = new Set([
        "teach_nms_gemsed_com",
        ...Object.keys(allPresence),
        ...Object.keys(allTimetables)
      ]);

      const resolved = [];
      keys.forEach((key) => {
        const p = allPresence[key] || {};
        const name = p.name || key.replace("_gemsed_com", "");

        if (p.dnd) {
          resolved.push({ key, name, hidden: true });
          return;
        }

        if (p.mode === "confirmed" && p.room) {
          resolved.push({
            key,
            name,
            floor: p.floor || "g",
            room: p.room,
            mode: "confirmed"
          });
          return;
        }

        const slot = getActiveSlot(allTimetables[key]);
        if (slot) {
          resolved.push({
            key,
            name,
            floor: slot.floor,
            room: slot.room,
            mode: "possible"
          });
          return;
        }

        if (p.mode === "possible" && p.room) {
          resolved.push({
            key,
            name,
            floor: p.floor || "g",
            room: p.room,
            mode: "possible"
          });
          return;
        }

        resolved.push({ key, name, hidden: true });
      });

      return resolved;
    }

    function render() {
      const floor = FLOORS[currentFloor];
      floorImg.setAttribute("href", floor.img);

      document.querySelectorAll(".floor-btn").forEach(btn => {
        btn.className = btn.dataset.floor === currentFloor
          ? "floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer"
          : "floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer";
      });

      polyLayer.innerHTML = "";
      beaconLayer.innerHTML = "";

      const roomCenters = {};
      floor.rooms.forEach(room => {
        roomCenters[room.name] = centerOf(room.points);
        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", room.points);
        poly.setAttribute("class", "room-poly");
        polyLayer.appendChild(poly);
      });

      const teachers = getResolvedTeachers();
      const prevSelected = teacherDropdown.value;
      teacherDropdown.innerHTML = teachers
        .map(t => `<option value="${t.key}">${t.name}</option>`)
        .join("");
      if (prevSelected) teacherDropdown.value = prevSelected;

      const shownTeachers = teachers.filter(t => !t.hidden && t.floor === currentFloor && t.room);

      visibleList.innerHTML = shownTeachers.length
        ? ""
        : `<p class="text-slate-500">No active teachers shown on Floor ${currentFloor.toUpperCase()}.</p>`;

      shownTeachers.forEach(t => {
        const c = roomCenters[t.room] || { x: 400, y: 350 };
        const isPossible = t.mode === "possible";
        const tagLabel = isPossible ? `Possible: ${t.name}` : t.name;
        const fill = isPossible ? "#b45309" : "#059669";
        const w = Math.max(100, tagLabel.length * 7.2 + 20);

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${c.x}, ${c.y - 10})`);

        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", "0");
        dot.setAttribute("cy", "10");
        dot.setAttribute("r", "6");
        dot.setAttribute("fill", isPossible ? "#fbbf24" : "#34d399");
        dot.setAttribute("stroke", "#fff");
        dot.setAttribute("stroke-width", "2");
        g.appendChild(dot);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", -w / 2);
        rect.setAttribute("y", "-20");
        rect.setAttribute("width", w);
        rect.setAttribute("height", "22");
        rect.setAttribute("rx", "11");
        rect.setAttribute("fill", fill);
        g.appendChild(rect);

        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", "0");
        txt.setAttribute("y", "-5");
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("fill", "#fff");
        txt.setAttribute("font-size", "11");
        txt.setAttribute("font-weight", "bold");
        txt.textContent = tagLabel;
        g.appendChild(txt);

        beaconLayer.appendChild(g);

        const item = document.createElement("div");
        item.className = "bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200";
        item.textContent = `${tagLabel} — Room ${t.room}`;
        visibleList.appendChild(item);
      });
    }

    document.querySelectorAll(".floor-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentFloor = btn.dataset.floor;
        render();
      });
    });

    document.getElementById("sendPingBtn").addEventListener("click", async () => {
      const targetKey = teacherDropdown.value;
      const reason = document.getElementById("pingReason").value;
      const newPingRef = push(ref(db, `pings/${targetKey}`));
      await set(newPingRef, {
        from: currentStudentEmail,
        reason,
        createdAt: Date.now()
      });
      const box = document.getElementById("pingStatus");
      box.textContent = `Ping sent to ${targetKey.replace("_gemsed_com", "")} (${reason})!`;
      box.classList.remove("hidden");
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      isLoggingOut = true;
      await signOut(auth);
      window.location.replace("./index.html");
    });

    await auth.authStateReady();
    if (!auth.currentUser) {
      window.location.replace("./index.html");
    } else {
      currentStudentEmail = auth.currentUser.email;
      document.getElementById("studentGreeting").textContent = `Welcome, ${auth.currentUser.email}`;

      onValue(ref(db, "presence"), (snap) => {
        allPresence = snap.val() || {};
        render();
      });

      onValue(ref(db, "timetables"), (snap) => {
        allTimetables = snap.val() || {};
        render();
      });

      onAuthStateChanged(auth, (user) => {
        if (!user && !isLoggingOut) {
          window.location.replace("./index.html");
        }
      });
    }

    setInterval(render, 10000);
    render();
  </script>
</body>
</html>
