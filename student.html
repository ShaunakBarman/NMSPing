<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NMSPing — Student Home</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .room-poly {
      fill: rgba(59, 130, 246, 0.2);
      stroke: #60a5fa;
      stroke-width: 1.5;
      cursor: pointer;
    }
    .room-poly:hover { fill: rgba(59, 130, 246, 0.36); }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 p-3 sm:p-5">
  <div class="max-w-6xl mx-auto space-y-4">
    <div id="campusBanner" class="hidden rounded-2xl bg-amber-500/20 border border-amber-400/50 px-4 py-2.5 text-xs font-semibold text-amber-200"></div>

    <header class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 flex flex-wrap items-center justify-between gap-3">
      <div>
        <div class="text-xs font-semibold text-emerald-400 uppercase">Student Home</div>
        <h1 id="studentGreeting" class="nms-heading text-xl font-bold text-white">NMSPing Map</h1>
        <p id="debugLine" class="nms-muted text-xs text-slate-400 mt-0.5">Loading map...</p>
      </div>

      <div class="flex flex-wrap items-center gap-2">
        <button id="themeToggleBtn" type="button" class="nms-subcard px-3 py-2 rounded-xl text-xs font-bold bg-slate-800 border border-slate-700 cursor-pointer">
          🌙 Night Mode
        </button>
        <button type="button" data-floor="g" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer">Floor G</button>
        <button type="button" data-floor="1" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 1</button>
        <button type="button" data-floor="2" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 2</button>
        <button type="button" data-floor="3" class="floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer">Floor 3</button>
        <button id="logoutBtn" type="button" class="px-3.5 py-2 rounded-xl text-xs font-semibold bg-slate-800 hover:bg-slate-700 text-slate-200 cursor-pointer">Log Out</button>
      </div>
    </header>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <aside class="space-y-4">
        <div class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3">
          <h2 class="nms-heading text-sm font-bold text-white">Ping a Teacher</h2>

          <div>
            <label for="teacherDropdown" class="nms-muted block text-xs text-slate-400 mb-1">Select Teacher</label>
            <select id="teacherDropdown" class="nms-input w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm">
              <option value="teach_nms_gemsed_com">teach_nms</option>
            </select>
          </div>

          <div>
            <label for="pingReason" class="nms-muted block text-xs text-slate-400 mb-1">Quick Tag</label>
            <select id="pingReason" class="nms-input w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-sm">
              <option value="2-Min Question">2-Min Question</option>
              <option value="IA / Coursework Check">IA / Coursework Check</option>
              <option value="Form Signature">Form Signature</option>
            </select>
          </div>

          <button
            type="button"
            id="sendPingBtn"
            class="w-full rounded-xl bg-emerald-600 disabled:bg-slate-800 disabled:text-slate-500 hover:bg-emerald-500 text-white font-semibold py-2.5 px-4 text-sm transition cursor-pointer"
          >
            Send Ping
          </button>

          <div id="pingStatus" class="hidden text-xs rounded-xl bg-emerald-950/60 border border-emerald-800 p-3 text-emerald-200 space-y-1"></div>
        </div>

        <div class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-2">
          <h2 class="nms-muted text-xs font-bold uppercase tracking-wider text-slate-400">On This Floor</h2>
          <div id="visibleList" class="nms-muted space-y-2 text-xs text-slate-400">No teachers shown on this floor.</div>
        </div>
      </aside>

      <section class="nms-card bg-slate-900 border border-slate-800 rounded-2xl p-3 sm:p-4 lg:col-span-2 space-y-2">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <span id="activeFloorLabel" class="text-xs font-bold uppercase tracking-wider text-emerald-400">Floor G</span>
          <button id="rotateMapBtn" type="button" class="nms-subcard px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-800 border border-slate-700 cursor-pointer">
            🔄 Rotate 90°
          </button>
        </div>

        <div class="overflow-x-auto">
          <div id="mapFrame" class="nms-map-sheet min-w-[320px]">
            <svg id="mapSvg" viewBox="0 0 1000 700" class="w-full h-auto rounded-xl bg-slate-950 border border-slate-800 touch-manipulation">
              <image id="floorImg" href="./floor-g.jpg" x="0" y="0" width="1000" height="700" preserveAspectRatio="xMidYMid meet" />
              <g id="polyLayer"></g>
              <g id="roomLabelLayer"></g>
              <g id="beaconLayer"></g>
            </svg>
          </div>
        </div>
      </section>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
    import { getAuth, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";
    import { getDatabase, ref, onValue, get, push, set } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-database.js";
    import { firebaseConfig, DEFAULT_FLOORS, mergeFloorRooms, mountNmsOpeningSplash, initDayNightToggle } from "./nms-data.js";

    mountNmsOpeningSplash();
    initDayNightToggle("themeToggleBtn");

    const STUDENT_COOLDOWN_MS = 3 * 60 * 1000;
    const PIGGYBACK_WINDOW_MS = 5 * 60 * 1000;

    let currentFloor = "g";
    let rotationDeg = 0;
    let allPresence = {};
    let allTimetables = {};
    let overridesByFloor = { g: {}, "1": {}, "2": {}, "3": {} };
    let currentStudentEmail = "";
    let isLoggingOut = false;

    const debugLine = document.getElementById("debugLine");
    const floorImg = document.getElementById("floorImg");
    const polyLayer = document.getElementById("polyLayer");
    const roomLabelLayer = document.getElementById("roomLabelLayer");
    const beaconLayer = document.getElementById("beaconLayer");
    const visibleList = document.getElementById("visibleList");
    const teacherDropdown = document.getElementById("teacherDropdown");
    const sendPingBtn = document.getElementById("sendPingBtn");
    const mapFrame = document.getElementById("mapFrame");
    const activeFloorLabel = document.getElementById("activeFloorLabel");

    function centerOf(pointsStr) {
      const pts = pointsStr.trim().split(/\s+/).map(p => {
        const [x, y] = p.split(",").map(Number);
        return { x, y };
      });
      const sum = pts.reduce((a, b) => ({ x: a.x + b.x, y: a.y + b.y }), { x: 0, y: 0 });
      return { x: Math.round(sum.x / pts.length), y: Math.round(sum.y / pts.length) };
    }

    function timeToMinutes(hhmm) {
      const [h, m] = (hhmm || "00:00").split(":").map(Number);
      return h * 60 + m;
    }

    function getActiveSlot(slots) {
      const now = new Date();
      const day = String(now.getDay());
      const mins = now.getHours() * 60 + now.getMinutes();
      return (slots || []).find(s => s.day === day && mins >= timeToMinutes(s.start) && mins <= timeToMinutes(s.end)) || null;
    }

    function getResolvedTeachers() {
      const keys = new Set(["teach_nms_gemsed_com", ...Object.keys(allPresence), ...Object.keys(allTimetables)]);
      const resolved = [];
      keys.forEach((key) => {
        const p = allPresence[key] || {};
        const name = p.name || key.replace("_gemsed_com", "");
        if (p.dnd) return resolved.push({ key, name, hidden: true, dnd: true });
        if (p.mode === "confirmed" && p.room) return resolved.push({ key, name, floor: p.floor || "g", room: p.room, mode: "confirmed" });
        const slot = getActiveSlot(allTimetables[key]);
        if (slot) return resolved.push({ key, name, floor: slot.floor, room: slot.room, mode: "possible" });
        if (p.mode === "possible" && p.room) return resolved.push({ key, name, floor: p.floor || "g", room: p.room, mode: "possible" });
        resolved.push({ key, name, hidden: true });
      });
      return resolved;
    }

    function applyRotation() {
      const scale = rotationDeg % 180 !== 0 ? " scale(0.76)" : "";
      mapFrame.style.transformOrigin = "center center";
      mapFrame.style.transform = `rotate(${rotationDeg}deg)${scale}`;
    }

    function updateCooldownUI() {
      const targetKey = teacherDropdown.value;
      const until = Number(localStorage.getItem(`nmsping_cd_${targetKey}`) || 0);
      const remaining = until - Date.now();
      if (remaining > 0) {
        sendPingBtn.disabled = true;
        const mins = Math.floor(remaining / 60000);
        const secs = Math.ceil((remaining % 60000) / 1000);
        sendPingBtn.textContent = `Cooldown (${mins}m ${secs}s)`;
      } else {
        sendPingBtn.disabled = false;
        sendPingBtn.textContent = "Send Ping";
      }
    }

    function render() {
      const floorMeta = DEFAULT_FLOORS[currentFloor];
      const rooms = mergeFloorRooms(currentFloor, overridesByFloor[currentFloor] || {});
      activeFloorLabel.textContent = floorMeta.label;
      floorImg.setAttribute("href", floorMeta.img);

      document.querySelectorAll(".floor-btn").forEach(btn => {
        btn.className = btn.dataset.floor === currentFloor
          ? "floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-blue-600 text-white cursor-pointer"
          : "floor-btn px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 cursor-pointer";
      });

      polyLayer.innerHTML = "";
      roomLabelLayer.innerHTML = "";
      beaconLayer.innerHTML = "";

      const roomCenters = {};
      rooms.forEach(room => {
        const c = centerOf(room.points);
        roomCenters[room.name] = c;

        const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        poly.setAttribute("points", room.points);
        poly.setAttribute("class", "room-poly");
        poly.addEventListener("click", () => {
          debugLine.textContent = `${room.name} (${floorMeta.label})`;
        });
        polyLayer.appendChild(poly);

        const lbl = document.createElementNS("http://www.w3.org/2000/svg", "text");
        lbl.setAttribute("x", c.x);
        lbl.setAttribute("y", c.y + 3);
        lbl.setAttribute("text-anchor", "middle");
        lbl.setAttribute("fill", "#e2e8f0");
        lbl.setAttribute("font-size", "9");
        lbl.setAttribute("font-weight", "700");
        lbl.setAttribute("pointer-events", "none");
        lbl.textContent = room.name;
        roomLabelLayer.appendChild(lbl);
      });

      const teachers = getResolvedTeachers();
      const prevSelected = teacherDropdown.value;
      teacherDropdown.innerHTML = teachers.map(t => `<option value="${t.key}">${t.name}</option>`).join("");
      if (prevSelected) teacherDropdown.value = prevSelected;

      const shownTeachers = teachers.filter(t => !t.hidden && t.floor === currentFloor && t.room);
      visibleList.innerHTML = shownTeachers.length
        ? ""
        : `<p>No active teachers shown on ${floorMeta.label}.</p>`;

      shownTeachers.forEach(t => {
        const c = roomCenters[t.room] || { x: 400, y: 350 };
        const isPossible = t.mode === "possible";
        const tagLabel = isPossible ? `Possible: ${t.name}` : t.name;
        const fill = isPossible ? "#b45309" : "#059669";
        const w = Math.max(100, tagLabel.length * 7.2 + 20);

        const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
        g.setAttribute("transform", `translate(${c.x}, ${c.y - 10})`);

        const dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", "0");
        dot.setAttribute("cy", "10");
        dot.setAttribute("r", "6");
        dot.setAttribute("fill", isPossible ? "#fbbf24" : "#34d399");
        dot.setAttribute("stroke", "#fff");
        dot.setAttribute("stroke-width", "2");
        g.appendChild(dot);

        const rect = document.createElementNS("http://www.w3.org/2000/svg", "rect");
        rect.setAttribute("x", -w / 2);
        rect.setAttribute("y", "-20");
        rect.setAttribute("width", w);
        rect.setAttribute("height", "22");
        rect.setAttribute("rx", "11");
        rect.setAttribute("fill", fill);
        g.appendChild(rect);

        const txt = document.createElementNS("http://www.w3.org/2000/svg", "text");
        txt.setAttribute("x", "0");
        txt.setAttribute("y", "-5");
        txt.setAttribute("text-anchor", "middle");
        txt.setAttribute("fill", "#fff");
        txt.setAttribute("font-size", "11");
        txt.setAttribute("font-weight", "bold");
        txt.textContent = tagLabel;
        g.appendChild(txt);

        beaconLayer.appendChild(g);

        const item = document.createElement("div");
        item.className = "nms-subcard bg-slate-950 border border-slate-800 rounded-xl px-3 py-2";
        item.textContent = `${tagLabel} — ${t.room}`;
        visibleList.appendChild(item);
      });
    }

    document.querySelectorAll(".floor-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentFloor = btn.dataset.floor;
        render();
      });
    });

    document.getElementById("rotateMapBtn").addEventListener("click", () => {
      rotationDeg = (rotationDeg + 90) % 360;
      applyRotation();
    });

    teacherDropdown.addEventListener("change", updateCooldownUI);
    render();

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    sendPingBtn.addEventListener("click", async () => {
      const targetKey = teacherDropdown.value;
      const reason = document.getElementById("pingReason").value;
      const box = document.getElementById("pingStatus");
      const storageKey = `nmsping_cd_${targetKey}`;
      if (Number(localStorage.getItem(storageKey) || 0) > Date.now()) return updateCooldownUI();

      sendPingBtn.disabled = true;
      try {
        const now = Date.now();
        const resolved = getResolvedTeachers().find(t => t.key === targetKey);
        if (resolved?.dnd) {
          box.innerHTML = `<div class="font-bold text-rose-300">Do Not Disturb is active</div><div>${resolved.name} is currently in a meeting.</div>`;
          box.classList.remove("hidden");
          return updateCooldownUI();
        }

        const snap = await get(ref(db, `pings/${targetKey}`));
        const recentPing = Object.values(snap.val() || {}).find(p => (now - (p.createdAt || 0)) < PIGGYBACK_WINDOW_MS);
        const newPingRef = push(ref(db, `pings/${targetKey}`));

        if (recentPing) {
          await set(newPingRef, { from: currentStudentEmail || "student@gemsed.com", reason, type: "coming", createdAt: now });
          if (resolved && !resolved.hidden && resolved.floor) {
            currentFloor = resolved.floor;
            render();
            box.innerHTML = `<div class="font-bold text-amber-300">Joined active ping (no extra alert sent)</div><div>${resolved.name} — <strong>Floor ${resolved.floor.toUpperCase()} • ${resolved.room}</strong></div>`;
          } else {
            box.innerHTML = `<div class="font-bold text-amber-300">Joined active ping (no extra alert sent)</div><div>Teacher notified that you are also coming.</div>`;
          }
        } else {
          await set(newPingRef, { from: currentStudentEmail || "student@gemsed.com", reason, type: "alert", createdAt: now });
          box.innerHTML = `<div class="font-bold text-emerald-300">Ping sent!</div><div>Reason: ${reason}</div>`;
        }

        localStorage.setItem(storageKey, String(now + STUDENT_COOLDOWN_MS));
        box.classList.remove("hidden");
        updateCooldownUI();
      } catch (err) {
        box.textContent = `Ping failed: ${err.message}`;
        box.classList.remove("hidden");
        sendPingBtn.disabled = false;
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", async () => {
      isLoggingOut = true;
      await signOut(auth);
      window.location.replace("./index.html");
    });

    auth.authStateReady().then(() => {
      if (!auth.currentUser) return window.location.replace("./index.html");
      currentStudentEmail = auth.currentUser.email;
      document.getElementById("studentGreeting").textContent = `Welcome, ${auth.currentUser.email}`;
      debugLine.textContent = "Connected to NMSPing live map";

      onValue(ref(db, "mapOverrides"), (snap) => {
        const val = snap.val() || {};
        overridesByFloor = { g: val.g || {}, "1": val["1"] || {}, "2": val["2"] || {}, "3": val["3"] || {} };
        render();
      });

      onValue(ref(db, "announcement"), (snap) => {
        const banner = document.getElementById("campusBanner");
        const txt = snap.val()?.text || "";
        banner.textContent = txt;
        banner.classList.toggle("hidden", !txt);
      });

      onValue(ref(db, "presence"), (snap) => {
        allPresence = snap.val() || {};
        render();
      });

      onValue(ref(db, "timetables"), (snap) => {
        allTimetables = snap.val() || {};
        render();
      });

      onAuthStateChanged(auth, (user) => {
        if (!user && !isLoggingOut) window.location.replace("./index.html");
      });
    });

    setInterval(() => { render(); updateCooldownUI(); }, 1000);
  </script>
</body>
</html>
